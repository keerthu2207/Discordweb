<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Friends UI</title>
<link rel="stylesheet" href="connections.css">
</head>
<body>

<div class="container">

    <!-- Left Icon Bar -->

    <div class="icon-bar">

        <div class="icon active"><a href="#">F</a></div>
        <div ><a href="index.html" class="icon">I</a></div>
        <div class="icon"><a href="#">+</a></div>


    </div>

    <!-- Sidebar -->

    <div class="sidebar">

        <input type="text" placeholder="Find or start a conversation">


        <h4>Direct Messages</h4>

        <ul class="dm">

            <li>Indiwebpros</li>
            <li>Kanishcharan</li>
            <li>Jainitteesh</li>
            <li>Jayavarshan</li>
            <li>Pranaya</li>


        </ul>

        <div class="profile">

            <div class="avatar"></div>

            <div>

                <strong>Keerthanaa</strong><br>
                <small>Online</small>

            </div>

        </div>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="topbar">

            <div class="tabs">

                <span class="title">Friends</span>

                <button class="active-btn">Online</button>
                <button>All</button>
                <button>Pending</button>
                <button class="add">Add Friend</button>

            </div>

        </div>

        <div class="content">

            <!-- Friends List -->

            <div class="friends">

                <input type="text" placeholder="Search">

                <p class="count">Online - 1</p>

                <div class="friend">

                    <div class="avatar pink"></div>

                    <div>

                        <h3>Kanishcharan</h3>
                        <p>Do Not Disturb</p>

                    </div>

                </div>

            </div>

            <!-- Active Now -->

            <div class="right-panel">

                <h2>Active Now</h2>

                <div class="card">

                    <h3>It's quiet for now...</h3>

                    <p>
                        When a friend starts an activity,
                        it will appear here.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
