<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Friends UI</title>
<link rel="stylesheet" href="assets/css/connections.css">
<script src="assets/js/connections.js" defer></script>
</head>
<body>

<div class="container">

    <!-- Left Icon Bar -->

    <div class="icon-bar">

        <div class="icon active"><a href="#">F</a></div>
        <div><a href="index.html" class="icon">I</a></div>
        <div class="icon"><a href="#">+</a></div>

    </div>

    <div id="authGate" class="auth-gate">Please log in to view your direct messages.</div>

    <!-- Sidebar -->

    <div class="sidebar" id="sidebar">

        <input type="text" placeholder="Find or start a conversation">

        <h4>Direct Messages</h4>

        <ul class="dm">
            <li class="selected" data-page="indiwebpros.html">Indiwebpros</li>
            <li data-page="kanishcharan.html">Kanishcharan</li>
            <li data-page="jainitteesh.html">Jainitteesh</li>
            <li data-page="jayavarshan.html">Jayavarshan</li>
            <li data-page="pranaya.html">Pranaya</li>
        </ul>

        <div class="profile">

            <div class="avatar"></div>

            <div class="profile-info">

                <strong id="userName">Keerthanaa</strong>
                <small id="userStatus">Online</small>

                <div class="auth-actions">
                    <button id="loginBtn" class="auth-btn">Login</button>
                    <button id="logoutBtn" class="auth-btn hidden">Logout</button>
                </div>

            </div>

        </div>

    </div>

    <!-- Main -->

    <div class="main" id="main">

        <div class="topbar">

            <div class="tabs">

                <span class="title">Friends</span>

                <button class="active-btn" data-view="online">Online</button>
                <button data-view="all">All</button>
                <button data-view="pending">Pending</button>
                <button class="add" data-view="add-friend">Add Friend</button>

            </div>

        </div>

        <div class="content">
            <div class="frame-shell">
                <iframe id="chatFrame" src="indiwebpros.html" name="chatFrame"></iframe>
            </div>
        </div>

    </div>

</div>

</body>
</html>
